<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Copy Freedom</title><link rel="stylesheet" href="style.css"></head><body>
<header><b class="logo">FNX<span>.</span></b><div><h1>Copy Freedom</h1><p>Your pixels. Anywhere.</p></div><span class="badge">LOCAL</span></header>
<div id="document" class="document">Open a document in Photoshop</div><div id="selection" class="selection">0 selected</div>
<section aria-label="Copy"><h2>COPY</h2><div class="buttons"><button id="layer" title="Copy selected layers or groups">Copy layer</button><button id="canvas" title="Copy the current artboard or full canvas">Copy canvas</button><button id="area" title="Copy the visible composite inside your pixel selection">Copy area</button><button id="areaLayer" title="Copy the area and add a masked visible-composite layer above the current layer">Copy area + new layer area</button></div></section>
<p id="status" role="status" aria-live="polite">Copy an image, then paste with Ctrl+V.</p><script src="panel.js"></script></body></html>
